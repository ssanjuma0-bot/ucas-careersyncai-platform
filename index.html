<script id="app-script-22">
/* =========================================================
   SOUND FX (Web Audio API, off by default, no external files)
   ========================================================= */
const SoundFx = {
  enabled: false,
  ctx: null,
  ensureCtx(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } } return this.ctx; },
  play(freq, dur, type){
    if(!this.enabled) return;
    const ctx = this.ensureCtx(); if(!ctx) return;
    try{
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = type||'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur||0.15));
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + (dur||0.15));
    }catch(e){}
  },
  click(){ this.play(440,0.06,'square'); },
  success(){ this.play(660,0.18,'sine'); },
  error(){ this.play(180,0.22,'sawtooth'); }
};
document.addEventListener('click', (e)=>{ if(e.target.closest('button')) SoundFx.click(); });
</script>

<script id="app-script-23">
/* =========================================================
   UCASION AI ASSISTANT
   Real provider abstraction (Gemini / OpenAI-compatible) +
   an honest, non-fake local rule-based fallback that uses
   the student's actual stored profile and job data.
   ========================================================= */
function formatAiText(raw){
  // Safe lightweight markdown: escape first, then re-introduce **bold**, `code`, and bullet lines.
  let s = esc(raw);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code style="background:#eef1f5;padding:1px 5px;border-radius:4px;font-size:12.5px;">$1</code>');
  const lines = s.split('\n');
  let html = ''; let inList = false;
  for(const line of lines){
    const bullet = line.match(/^\s*[-•]\s+(.*)/);
    if(bullet){
      if(!inList){ html += '<ul style="margin:6px 0 6px 18px;padding:0;">'; inList = true; }
      html += `<li style="margin-bottom:3px;">${bullet[1]}</li>`;
    } else {
      if(inList){ html += '</ul>'; inList=false; }
      html += line.length ? `<div>${line}</div>` : '<div style="height:6px;"></div>';
    }
  }
  if(inList) html += '</ul>';
  return html;
}
const AI = {
  open:false, listening:false, currentChatId:null, config:{provider:'',apiKey:'',model:''},
  recognition:null,

  async refreshStatus(){
    const settings = await dbGetAll('settings');
    const cfg = settings.find(s=>s.id==='aiConfig') || {provider:'',apiKey:'',model:''};
    this.config = cfg;
    const dot = $('#ai-status-dot'); const text = $('#ai-status-text');
    if(!dot) return;
    if(cfg.provider && cfg.apiKey){ dot.style.background='#8fe3a8'; text.textContent = 'Connected: '+ (cfg.provider==='gemini'?'Google Gemini':'OpenAI-compatible') + (cfg.model? (' · '+cfg.model):''); }
    else{ dot.style.background='#e8cd6e'; text.textContent = 'Local Assistant Mode (no AI provider configured)'; }
  },

  async toggle(){
    const panel = $('#ai-panel');
    this.open = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    if(this.open){
      await this.refreshStatus();
      if(!this.currentChatId) await this.newChat();
      this.renderSuggested();
    }
  },

  async newChat(){
    const conv = await dbSave('aiConversations', { id: uid('conv'), userId: Session.current.userId, title:'New Chat', messages:[] });
    this.currentChatId = conv.data.id;
    $('#ai-body').innerHTML = `<div class="msg sys">New conversation started. Ask UCASION anything about your career, resume, skills, interviews, or general topics — in English, Tamil, Tanglish or Hindi.</div>`;
    refreshAiFabIcon('idle');
  },

  renderSuggested(){
    const prompts = ['Review my resume','Give me a roadmap for Data Analytics','Prepare me for an HR interview','Suggest projects based on my skills','What is SQL JOIN?'];
    $('#ai-suggested').innerHTML = prompts.map(p=>`<button class="chip" onclick="AI.sendText('${p.replace(/'/g,"\\'")}')">${p}</button>`).join('');
  },

  appendMsg(role, text){
    const body = $('#ai-body');
    const div = document.createElement('div');
    div.className = 'msg '+role;
    if(role==='ai'){ div.innerHTML = formatAiText(text); }
    else{ div.textContent = text; }
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div;
  },

  appendTyping(){
    const body = $('#ai-body');
    const div = document.createElement('div');
    div.className = 'msg ai'; div.id='ai-typing-indicator';
    div.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    body.appendChild(div); body.scrollTop = body.scrollHeight;
  },
  removeTyping(){ const t=$('#ai-typing-indicator'); if(t) t.remove(); },

  async send(){
    const input = $('#ai-text-input');
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    await this.sendText(text);
  },

  async sendText(text){
    this.appendMsg('user', text);
    refreshAiFabIcon('thinking');
    this.appendTyping();
    let reply;
    try{
      if(this.config.provider && this.config.apiKey){
        reply = await this.callLiveProvider(text);
      } else {
        reply = await this.localFallback(text);
      }
    }catch(e){
      reply = "UCASION AI is temporarily unavailable: " + (e.message||'the AI service could not be reached') + ". Showing local guidance instead.\n\n" + await this.localFallback(text);
      refreshAiFabIcon('error');
    }
    this.removeTyping();
    this.appendMsg('ai', reply);
    refreshAiFabIcon('idle');
    if(this.config.voiceOutput!==false) this.maybeSpeak(reply);
    // persist
    const conv = await dbGet('aiConversations', this.currentChatId);
    if(conv){ conv.messages.push({role:'user',text},{role:'ai',text:reply}); await dbSave('aiConversations', conv); }
  },

  /* Real provider call — genuinely calls the configured external API.
     In network-restricted environments this will throw, which is caught above and reported honestly. */
  async callLiveProvider(userText){
    const student = Session.current.role==='student' ? await currentStudent() : null;

    const systemPrompt = `You are UCASION, the AI career assistant for UCAS CareerSync AI at United College of Arts and Science. Answer helpfully and concisely. Detect and respond in the user's language (English, Tamil, Tanglish or Hindi). ${contextStr}`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(this.config.apiKey)}`;
      const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},

      if(!resp.ok) throw new Error('Gemini API returned status '+resp.status);

      return t;
    } else if(this.config.provider==='openai'){

      const resp = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST',

      const t = data?.choices?.[0]?.message?.content;
      if(!t) throw new Error('AI API returned an empty response');
      return t;
    }
    throw new Error('No AI provider configured');
  },

  /* Honest local fallback: rule-based, uses real stored student/job data, never invents facts. */
  async localFallback(text){
    const lower = text.toLowerCase();
    const student = Session.current && Session.current.role==='student' ? await currentStudent() : null;

    if(/resume/.test(lower)){
      if(!student) return "I can help with resumes once you're logged in as a student so I can look at your actual profile.";
      const resume = await studentResume(student.id);
      if(!resume) return "You don't have a resume yet. Go to Resume Builder and click 'Create Your Resume' — it will pull from your saved profile (education, skills, projects, certifications).";
      const gap = CareerLogic.skillGap(student);

    }
    if(/skill.*(gap|improve|learn)|what skills/.test(lower)){
      if(!student) return "Log in as a student so I can compare your actual saved skills against your target role.";
      const gap = CareerLogic.skillGap(student);
      if(!gap.missing.length) return `Great news — your skills already cover everything commonly required for ${gap.role} on this platform (${gap.matched.join(', ')}).`;
      return `Comparing your saved skills to ${gap.role} requirements: you have ${gap.matched.join(', ')||'none of the core skills yet'}. Missing: ${gap.missing.join(', ')}. I'd suggest starting with ${gap.missing[0]}.`;
    }
    if(/which jobs|best jobs|job.*(for me|recommend)/.test(lower)){
      if(!student) return "Log in as a student and I can match you against real job listings on the platform.";
      const jobsResAi = await api('GET', '/api/jobs');
      const jobs = (jobsResAi.ok ? jobsResAi.data.jobs : []).filter(j=>j.status==='open');

    if(/python loop|for loop|while loop/.test(lower)) return "In Python, a `for` loop iterates over a sequence (list, range, string): `for i in range(5): print(i)`. A `while` loop repeats while a condition is true: `while x < 5: x += 1`. Use `break` to exit early and `continue` to skip to the next iteration.";
    if(/power ?bi/.test(lower)) return "Power BI is Microsoft's business intelligence tool for connecting to data sources, building interactive dashboards, and writing DAX formulas for calculated metrics. It's widely required for Data Analyst and BI roles.";
    if(/என்ன skills|skill.*பண்ண|தமிழ்/.test(text)) return "உங்கள் career goal-க்கு தேவையான skills-ஐ பார்க்க, Skill Gap Analyzer பக்கத்தை பார்க்கவும் — உங்கள் profile-ல் சேர்த்த skills-உடன் ஒப்பிட்டு காட்டும்.";
    if(/resume epdi|panradhu|panna vendum/.test(lower)) return "Unga resume improve panna, Profile page-ல unga skills, projects, certifications properaa fill pannunga — Resume Builder automatic-a andha data-vaye pull pannum.";
    if(/मुझे|चाहिए|कैसे/.test(text)) return "अपने करियर लक्ष्य के लिए ज़रूरी स्किल्स देखने के लिए Skill Gap Analyzer पेज देखें — यह आपकी प्रोफ़ाइल के स्किल्स से तुलना करके दिखाता है।";
    if(/^(hi|hello|hey|hai)\b/.test(lower) && lower.length<20) return `Hello${student? ', '+student.fullName.split(' ')[0] : ''}! I'm UCASION. I can help with:\n- Resume review & status\n- Skill-gap analysis for your target role\n- Career roadmap progress\n- Job matching from real listings\n- Interview prep, SQL/Python/Excel/Power BI basics\n\nWhat would you like to start with?`;
    if(/thank|thanks|thank you/.test(lower)) return "You're welcome! Let me know if you'd like help with anything else on your career profile.";
    if(/who are you|what can you do|what are you/.test(lower)) return "I'm UCASION, the built-in career assistant for UCAS CareerSync AI. In local mode I give reliable, data-grounded help on your resume, skill gaps, roadmap and job matches, plus explanations for common technical/career topics. Connect a live AI provider in Settings for fully open-ended conversation.";

    /* Broader technical/career knowledge base — kept factual and concise. */
    const KB = [
      [/what is python|python.*(good for|used for)/, "Python is a general-purpose, readable programming language widely used for data analysis, automation, web backends, and machine learning. Its large ecosystem (Pandas, NumPy, Django) makes it a common first language for Data Analytics roles."],
      [/excel.*(formula|vlookup|pivot)|what is excel/, "Excel is spreadsheet software used for data entry, calculation and reporting. Key skills recruiters look for: VLOOKUP/XLOOKUP, Pivot Tables, conditional formatting, and basic formulas (SUMIF, COUNTIF, IF). Pivot Tables summarize large datasets into interactive tables without formulas."],
      [/what is (a )?database|dbms/, "A database stores structured data so it can be reliably queried and updated. A DBMS (Database Management System, e.g. MySQL, PostgreSQL) is the software that manages storage, queries, and access control for that data."],
      [/machine learning|what is ml\b/, "Machine Learning is a field where algorithms learn patterns from data instead of being explicitly programmed. Common beginner topics: supervised learning (regression/classification), unsupervised learning (clustering), and evaluating models with metrics like accuracy or RMSE."],
      [/data structure|algorithm/, "Data structures (arrays, lists, stacks, queues, trees, hash maps) organize data efficiently; algorithms are step-by-step procedures that operate on them. For interviews, focus first on arrays, hash maps, and basic sorting/searching complexity (Big-O)."],
      [/git |version control|github.*(work|use)/, "Git is a version control system that tracks changes to code. Core commands: `git init`, `git add`, `git commit`, `git push`, `git pull`, `git branch`. GitHub hosts Git repositories online and is commonly used to showcase projects to recruiters."],
      [/oop|object.oriented/, "OOP (Object-Oriented Programming) organizes code around objects with properties and behavior. Four pillars: Encapsulation, Abstraction, Inheritance, and Polymorphism."],
      [/html|css basics|what is css/, "HTML structures web page content; CSS styles it (layout, color, spacing). Together with JavaScript (behavior), they form the core of front-end web development."],
      [/javascript|what is js\b/, "JavaScript is the programming language that runs in web browsers to make pages interactive — handling clicks, updating content dynamically, and communicating with servers."],
      [/statistics|standard deviation|mean vs median/, "Core statistics for Data Analytics: mean/median/mode measure central tendency; standard deviation measures spread; correlation measures how two variables move together. These underpin most dashboards and A/B testing."],
      [/cloud computing|what is aws|what is azure/, "Cloud computing means renting computing resources (servers, storage, databases) over the internet instead of owning hardware. AWS, Azure, and Google Cloud are the major providers, each offering compute, storage, and managed database services."],
      [/networking|what is an ip|tcp.ip/, "Computer networking basics: an IP address identifies a device on a network; TCP/IP is the protocol suite that governs how data is packaged and routed between devices on the internet."],
      [/cover letter/, "A good cover letter is 3-4 short paragraphs: (1) who you are and the role you want, (2) 1-2 concrete achievements relevant to the job, (3) why this company specifically, (4) a confident closing line. Keep it under 300 words."],
      [/linkedin.*(improve|profile|tips)/, "To improve your LinkedIn profile: use a clear headshot, write a headline stating your target role (not just 'Student'), add a 2-3 line About section with your key skills, and list projects with measurable outcomes where possible."],
      [/group discussion|gd tips/, "For group discussions: speak early to set the tone, back opinions with a concrete reason or example, actively listen and build on others' points instead of repeating them, and stay calm if interrupted."],
      [/aptitude|reasoning.*(prepare|practice)/, "For aptitude rounds, practice in three buckets: quantitative (percentages, ratios, time-speed-distance), logical reasoning (puzzles, seating arrangements), and verbal (reading comprehension, sentence correction) — a little daily practice compounds fast."],
      [/data analyst.*(role|do|means)|what does a data analyst/, "A Data Analyst collects, cleans, and analyzes data to answer business questions — typically using SQL to query data, Excel/Power BI to report it, and statistics to interpret it. Strong communication matters as much as technical skill, since you're translating numbers into decisions."],
      [/business analyst.*(role|do|means)/, "A Business Analyst bridges business needs and technical teams — gathering requirements, analyzing processes, and often using SQL/Excel to support recommendations. Communication and stakeholder management are as important as technical tools here."],
    ];
    for(const [re, ans] of KB){ if(re.test(lower)) return ans; }

    // Helpful, non-generic fallback: still grounded, still useful, never a dead end.
    return `I don't have a specific answer prepared for that exact question in local mode (no external AI provider is connected right now).\n\nHere's what I can help with directly, using your real saved data:\n- **Resume** — status, gaps, what to add next\n- **Skill Gap** — your skills vs. any target role's requirements\n- **Roadmap** — your next concrete step\n- **Jobs** — your best current matches with match %\n- **Concepts** — SQL, Python, Excel, Power BI, statistics, Git, OOP, networking, cloud basics, cover letters, LinkedIn, interview/GD/aptitude prep\n\nTry rephrasing around one of those, or connect a Gemini/OpenAI key in AI Settings for open-ended conversation.`;
  },

  maybeSpeak(text){
    if(!('speechSynthesis' in window)) return;
    try{
      const u = new SpeechSynthesisUtterance(text.slice(0,600));
      speechSynthesis.speak(u);
    }catch(e){}
  },

  toggleVoiceInput(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast('Voice input is not supported in this browser.','warn'); return; }
    const btn = $('#ai-mic-btn');
    if(this.listening){
      if(this.recognition) this.recognition.stop();
      this.listening=false; btn.classList.remove('active'); refreshAiFabIcon('idle');
      return;
    }
    this.recognition = new SR();
    this.recognition.lang = 'en-IN'; this.recognition.interimResults=false;
    this.recognition.onstart = ()=>{ this.listening=true; btn.classList.add('active'); refreshAiFabIcon('listening'); };
    this.recognition.onresult = (e)=>{ const t = e.results[0][0].transcript; $('#ai-text-input').value = t; };
    this.recognition.onerror = ()=>{ toast('Microphone access denied or unavailable.','error'); this.listening=false; btn.classList.remove('active'); refreshAiFabIcon('idle'); };
    this.recognition.onend = ()=>{ this.listening=false; btn.classList.remove('active'); refreshAiFabIcon('idle'); };
    try{ this.recognition.start(); }catch(e){ toast('Unable to start voice input.','error'); }
  }
};
</script>

<script id="app-script-25">
/* =========================================================
   INIT
   ========================================================= */
async function initializeStorage(){ return await StorageManager.init(); }
async function seedDataIfRequired(){ return await seedIfNeeded(); }
function restoreSession(){ Session.restore(); }
async function initializeUI(){
  await AI.refreshStatus();
  const soundCfg = (await dbGetAll('settings')).find(s=>s.id==='soundConfig');
  SoundFx.enabled = soundCfg ? !!soundCfg.enabled : false;
  await Router.go();
}

window.addEventListener('error', (e)=>{ console.error('Uncaught error:', e.error||e.message); });
window.addEventListener('unhandledrejection', (e)=>{ console.error('Unhandled promise rejection:', e.reason); });

(async function boot(){
  try{
    const mode = await initializeStorage();
    if(mode==='memory'){ toast('Browser storage is unavailable. Your data will not be saved after this session.','warn', 6000); }
    else if(mode==='localstorage'){ console.info('Using localStorage fallback (IndexedDB unavailable).'); }
    await seedDataIfRequired();
    restoreSession();
    await initializeUI();
  }catch(e){
    console.error('Fatal boot error', e);
    $('#app').innerHTML = `<div class="container" style="padding:60px 0;"><div class="card"><h2>UCAS CareerSync AI failed to start</h2><p>${esc(e.message||'Unknown error')}</p></div></div>`;
  }
})();
</script>
