<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCAS CareerSync AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="app-styles">
:root{
  --navy:#0e2a4a; --navy-dark:#081a30; --navy-light:#1b3d6d;
  --indigo:#4b3fd6; --indigo-light:#7c6ff2;
  --gold:#d4af37; --gold-light:#e8cd6e;
  --grey-bg:#f5f6fb; --card:#ffffff; --border:#e3e6ee;
  --text:#161b2e; --text-mute:#5c6478;
  --success:#1e8e5a; --danger:#c0392b; --warn:#b8860b;
  --radius:14px; --shadow:0 4px 18px rgba(20,20,60,.07);
  --shadow-lg:0 16px 46px rgba(20,20,60,.18);
  --serif:"Plus Jakarta Sans","Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;
  --ui:"Manrope",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--grey-bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.55;}
h1,h2,h3,h4,.brand,.serif{font-family:var(--serif);font-weight:700;letter-spacing:-0.01em;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--ui);cursor:pointer;}
img{max-width:100%;}
::selection{background:var(--gold-light);}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* Layout shells */
#app{min-height:100vh;}
.hidden{display:none !important;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--indigo));color:#fff;}
.btn-primary:hover{background:linear-gradient(135deg,var(--indigo),var(--indigo-light));box-shadow:var(--shadow);transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:var(--navy-dark);}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent;border-color:var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy);color:#fff;}
.btn-ghost{background:transparent;color:var(--text-mute);}
.btn-ghost:hover{background:#eef1f5;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;}
.grid{display:grid;gap:18px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-mute);letter-spacing:.02em;}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--ui);background:#fff;color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
.field .error-text{color:var(--danger);font-size:12px;display:none;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}
.field.invalid .error-text{display:block;}
.field textarea{resize:vertical;min-height:70px;}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em;}
.badge-navy{background:#e7edf6;color:var(--navy);}
.badge-gold{background:#fbf1d3;color:#8a6d1c;}
.badge-green{background:#e2f5ea;color:var(--success);}
.badge-red{background:#fbe4e1;color:var(--danger);}
.badge-grey{background:#eceff2;color:var(--text-mute);}

/* Topbar / nav */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy-dark),var(--navy));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:#fff;}
.brand .logo-badge{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.3);background:#fff;}
.brand .logo-badge img{width:100%;height:100%;object-fit:cover;}
.brand small{display:block;font-family:var(--ui);font-size:10.5px;font-weight:500;color:var(--gold-light);letter-spacing:.05em;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-links a,.nav-links button{color:#dfe7f3;padding:8px 12px;border-radius:6px;font-size:13.5px;font-weight:600;}
.nav-links a:hover,.nav-links button:hover{background:rgba(255,255,255,.12);color:#fff;}
.nav-links a.active{background:rgba(212,175,55,.22);color:var(--gold-light);}

/* App shell with sidebar for dashboards */
.app-shell{display:flex;min-height:calc(100vh - 60px);}
.sidebar{width:230px;background:var(--navy-dark);color:#dfe7f3;flex-shrink:0;padding:18px 12px;}
.sidebar .side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;margin-bottom:3px;color:#c9d5e4;}
.sidebar .side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.sidebar .side-link.active{background:var(--gold);color:var(--navy-dark);}
.sidebar .side-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f83a0;margin:16px 8px 6px;}
.main-area{flex:1;min-width:0;padding:26px;}
@media (max-width:880px){
  .sidebar{position:fixed;left:-260px;top:60px;bottom:0;z-index:60;transition:left .25s ease;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .main-area{padding:16px;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
}
.mobile-menu-btn{display:none;background:transparent;color:#fff;font-size:22px;border:none;padding:4px 8px;}
@media (max-width:880px){.mobile-menu-btn{display:inline-flex;}}
@media (max-width:600px){
  .topbar .inner{flex-wrap:wrap;gap:6px;padding:10px 14px;}
  .brand{font-size:16px;}
  .brand small{font-size:9px;}
  .nav-links{gap:2px;flex-wrap:wrap;}
  .nav-links a,.nav-links button{padding:6px 8px;font-size:11.5px;}
}
@media (max-width:880px){.mobile-menu-btn{display:inline-flex;}}

/* Landing */
.hero{position:relative;background:linear-gradient(135deg,var(--navy-dark),var(--navy) 55%,var(--navy-light));color:#fff;overflow:hidden;}
.hero .container{padding:70px 24px 60px;position:relative;z-index:2;}
.hero-bg-pattern{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(circle at 20% 30%, var(--gold) 0, transparent 40%),radial-gradient(circle at 80% 70%, var(--gold-light) 0, transparent 35%);}
.hero h1{font-size:44px;margin:0 0 12px;line-height:1.15;}
.hero p.tag{font-size:17px;color:#cfe0f7;max-width:560px;margin:0 0 26px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;}
.stat-row{display:flex;gap:34px;margin-top:44px;flex-wrap:wrap;}
.stat-row .stat b{font-size:26px;display:block;color:var(--gold-light);font-family:var(--serif);}
.stat-row .stat span{font-size:12px;color:#b9c9de;}
.landing-section{padding:56px 0;}
.landing-section h2{font-size:28px;margin:0 0 8px;}
.landing-section p.lead{color:var(--text-mute);margin:0 0 28px;max-width:600px;}
.feature-card{padding:20px;}
.feature-card .icon{width:44px;height:44px;border-radius:10px;background:#eef3fa;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--navy);}
footer{background:var(--navy-dark);color:#9db0c9;padding:30px 0;font-size:13px;text-align:center;}

/* Auth pages */
.auth-wrap{min-height:calc(100vh - 60px);display:flex;align-items:stretch;}
.auth-left{flex:1;background:linear-gradient(160deg,var(--navy-dark),var(--navy));display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff;padding:30px;}
.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;}
.auth-card{width:100%;max-width:440px;}
@media (max-width:880px){.auth-left{display:none;}}
.char-caption{margin-top:10px;font-size:13px;color:#cfe0f7;text-align:center;}

/* SVG character */
.svg-char{filter:drop-shadow(0 14px 24px rgba(0,0,0,.35));}
.char-row{display:flex;gap:26px;align-items:flex-end;}
@keyframes breathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes blink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(0.1);}}
.char-body{animation:breathe 3.2s ease-in-out infinite;}
.char-eye{animation:blink 4.5s infinite;transform-origin:center;}

/* Assistant floating widget */
.ai-fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,var(--gold-light),var(--gold));box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:80;border:none;}
.ai-fab:hover{transform:translateY(-2px);}
.ai-panel{position:fixed;right:22px;bottom:94px;width:380px;max-width:92vw;height:560px;max-height:75vh;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);z-index:81;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
.ai-panel.hidden{display:none;}
.ai-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.ai-head .status-dot{width:8px;height:8px;border-radius:50%;background:#8fe3a8;}
.ai-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f7f9fc;}
.msg{max-width:85%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px;}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:3px;}
.msg.sys{align-self:center;background:#fdf3d6;color:#7a5c0d;font-size:12px;padding:6px 10px;}
.typing-dots span{display:inline-block;width:5px;height:5px;background:#9aa8b8;border-radius:50%;margin:0 1px;animation:tdot 1.1s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes tdot{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
.ai-input-row{border-top:1px solid var(--border);padding:10px;display:flex;gap:6px;background:#fff;}
.ai-input-row input{flex:1;border:1px solid var(--border);border-radius:20px;padding:9px 14px;font-size:13.5px;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn.active{background:var(--danger);color:#fff;border-color:var(--danger);}
.suggested-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;}
.chip{background:#eef3fa;color:var(--navy);border:none;border-radius:16px;padding:6px 11px;font-size:11.5px;font-weight:600;}
.chip:hover{background:var(--navy);color:#fff;}

/* Toast */
#toast-wrap{position:fixed;top:70px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{min-width:260px;max-width:340px;background:#fff;border-left:4px solid var(--navy);border-radius:8px;box-shadow:var(--shadow-lg);padding:12px 14px;font-size:13.5px;animation:toastIn .25s ease;}
.toast.success{border-color:var(--success);}
.toast.error{border-color:var(--danger);}
.toast.warn{border-color:var(--warn);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* progress */
.progress-bar{height:8px;border-radius:5px;background:#e9edf3;overflow:hidden;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy-light));border-radius:5px;transition:width .6s ease;}
.kpi{text-align:center;}
.kpi b{font-size:26px;font-family:var(--serif);color:var(--navy);display:block;}
.kpi span{font-size:12px;color:var(--text-mute);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;}
th{color:var(--text-mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
.table-wrap{overflow-x:auto;}

.skeleton{background:linear-gradient(90deg,#eceff3 25%,#f6f8fa 37%,#eceff3 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px;}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-mute);}
.empty-state .e-icon{font-size:38px;margin-bottom:10px;}

.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pill-tabs button{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--text-mute);}
.pill-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.skill-tag{background:#eef3fa;color:var(--navy);padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600;}
.skill-tag.missing{background:#fbe4e1;color:var(--danger);}
.skill-tag.matched{background:#e2f5ea;color:var(--success);}

.job-card{padding:18px;display:flex;flex-direction:column;gap:8px;}
.job-card .jc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.match-ring{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.reveal{animation:fadeUp .4s ease both;}
@keyframes routeFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.route-fade{animation:routeFade .28s ease both;}
@media (prefers-reduced-motion: reduce){.route-fade{animation:none;}}

.welcome-overlay{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy-dark),var(--navy));z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;}
.welcome-overlay h1{font-size:34px;animation:fadeUp .6s ease both;}
.welcome-overlay p{color:#cfe0f7;animation:fadeUp .6s .15s ease both;}

.notif-dot{position:absolute;top:2px;right:2px;width:9px;height:9px;background:var(--danger);border-radius:50%;border:2px solid var(--navy);}
.notif-item{padding:12px;border-bottom:1px solid var(--border);font-size:13px;}
.notif-item.unread{background:#f3f7fd;}
.notif-item b{display:block;margin-bottom:2px;}
.notif-item small{color:var(--text-mute);}

.resume-sheet{background:#fff;padding:34px;box-shadow:var(--shadow);max-width:720px;margin:0 auto;font-family:var(--serif);}
.resume-sheet h2{margin:0 0 2px;}
.resume-sheet .r-role{color:var(--text-mute);margin-bottom:10px;font-family:var(--ui);}
.resume-sheet section{margin-top:16px;}
.resume-sheet h4{border-bottom:2px solid var(--gold);padding-bottom:4px;margin-bottom:8px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;}
@media print{.no-print{display:none !important;} body{background:#fff;} .resume-sheet{box-shadow:none;}}

.roadmap-line{display:flex;flex-direction:column;gap:0;}
.rm-stage{display:flex;gap:14px;position:relative;padding-bottom:26px;}
.rm-stage .dot{width:30px;height:30px;border-radius:50%;background:#e9edf3;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-mute);flex-shrink:0;z-index:1;}
.rm-stage.done .dot{background:var(--success);color:#fff;}
.rm-stage.current .dot{background:var(--gold);color:var(--navy-dark);}
.rm-stage:not(:last-child)::before{content:'';position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--border);}
.rm-stage.done:not(:last-child)::before{background:var(--success);}

.uniform-note{font-size:11px;color:#9db0c9;}
select.role-select{padding:10px;border-radius:8px;border:1px solid var(--border);width:100%;}

.dz{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--text-mute);font-size:12.5px;cursor:pointer;}
.dz:hover{border-color:var(--navy);}
</style>
</head>
<body>
<div id="toast-wrap"></div>
<div id="app"></div>

<!-- ============ AI FLOATING WIDGET ============ -->
<button id="ai-fab" class="ai-fab hidden" title="UCASION AI Assistant" onclick="AI.toggle()">
  <svg width="30" height="30" viewBox="0 0 40 40" id="ai-fab-char"><g id="fab-char-inner"></g></svg>
</button>
<div id="ai-panel" class="ai-panel hidden">
  <div class="ai-head">
    <svg width="34" height="34" viewBox="0 0 40 40" id="ai-head-char"></svg>
    <div style="flex:1">
      <div style="font-weight:700;font-size:14px;">UCASION</div>
      <div style="font-size:11px;color:#cfe0f7;display:flex;align-items:center;gap:5px;"><span class="status-dot" id="ai-status-dot"></span><span id="ai-status-text">Local Assistant Mode</span></div>
    </div>
    <button class="icon-btn" onclick="AI.newChat()" title="New chat" style="background:transparent;border-color:rgba(255,255,255,.3);color:#fff;">＋</button>
    <button class="icon-btn" onclick="AI.toggle()" title="Close" style="background:transparent;border-color:rgba(255,255,255,.3);color:#fff;">✕</button>
  </div>
  <div class="ai-body" id="ai-body"></div>
  <div class="suggested-row" id="ai-suggested"></div>
  <div class="ai-input-row">
    <button class="icon-btn" id="ai-mic-btn" onclick="AI.toggleVoiceInput()" title="Voice input">🎤</button>
    <input id="ai-text-input" placeholder="Ask UCASION anything..." onkeydown="if(event.key==='Enter')AI.send()">
    <button class="icon-btn" onclick="AI.send()" title="Send">➤</button>
  </div>
</div>

<div id="modal-root"></div>

<script id="app-script">
'use strict';
/* =========================================================
   UCAS CareerSync AI — single-file application
   ========================================================= */

const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
function esc(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function toast(msg,type='info',ms=3600){
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, ms);
}

async function sha256(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // Fallback simple hash if Web Crypto unavailable (should not happen in modern browsers)
    let h=0; for(let i=0;i<text.length;i++){ h=(h<<5)-h+text.charCodeAt(i); h|=0; }
    return 'fallback_'+Math.abs(h).toString(16);
  }
}

function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function isValidMobile(m){ return /^[6-9]\d{9}$/.test(String(m).replace(/\D/g,'')); }

/* =========================================================
   STORAGE MANAGER — IndexedDB primary, localStorage fallback
   ========================================================= */
const STORES = ['users','students','recruiters','admins','jobs','applications','interviews',
                 'notifications','resumes','aiConversations','settings','auditLogs','rosterStudents','certificates'];

const StorageManager = (function(){
  let mode = null; // 'indexeddb' | 'localstorage' | 'memory'
  let db = null;
  const memStore = {}; // used if both fail
  const DB_NAME = 'ucas_careersync_db';
  const DB_VERSION = 2; // bumped: added rosterStudents + certificates stores
  const LS_KEY = 'ucas_careersync_ls_v1';

  function lsLoad(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function lsSave(data){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); return true; }catch(e){ return false; }
  }

  function openIndexedDB(){
    return new Promise((resolve,reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
      let req;
      try{ req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch(e){ reject(e); return; }
      req.onupgradeneeded = (ev)=>{
        const _db = ev.target.result;
        STORES.forEach(name=>{
          if(!_db.objectStoreNames.contains(name)){
            _db.createObjectStore(name, {keyPath:'id'});
          }
        });
      };
      req.onsuccess = ()=>{ resolve(req.result); };
      req.onerror = ()=>{ reject(req.error || new Error('IndexedDB open failed')); };
      req.onblocked = ()=>{ reject(new Error('IndexedDB blocked')); };
    });
  }

  async function init(){
    try{
      db = await openIndexedDB();
      mode = 'indexeddb';
    }catch(e){
      console.warn('IndexedDB unavailable, falling back to localStorage', e);
      try{
        const test='__t__'+Date.now(); localStorage.setItem(test,'1'); localStorage.removeItem(test);
        mode = 'localstorage';
        const data = lsLoad();
        STORES.forEach(s=>{ if(!data[s]) data[s]={}; });
        lsSave(data);
      }catch(e2){
        console.warn('localStorage unavailable too, using in-memory store (data will not persist across reloads)', e2);
        mode = 'memory';
        STORES.forEach(s=>{ memStore[s]={}; });
      }
    }
    return mode;
  }

  function idbTx(store, type){
    return db.transaction(store, type).objectStore(store);
  }

  async function put(store, record){
    if(!record.id) record.id = uid(store);
    record.updatedAt = nowISO();
    if(!record.createdAt) record.createdAt = record.updatedAt;
    if(mode==='indexeddb'){
      return new Promise((resolve,reject)=>{
        try{
          const req = idbTx(store,'readwrite').put(record);
          req.onsuccess = ()=>resolve(record);
          req.onerror = ()=>reject(req.error);
        }catch(e){ reject(e); }
      });
    } else if(mode==='localstorage'){
      const data = lsLoad(); if(!data[store]) data[store]={};
      data[store][record.id]=record;
      if(!lsSave(data)) throw new Error('Unable to persist to localStorage (quota or disabled)');
      return record;
    } else {
      memStore[store][record.id]=record; return record;
    }
  }

  async function get(store, id){
    if(mode==='indexeddb'){
      return new Promise((resolve,reject)=>{
        try{
          const req = idbTx(store,'readonly').get(id);
          req.onsuccess = ()=>resolve(req.result||null);
          req.onerror = ()=>reject(req.error);
        }catch(e){ reject(e); }
      });
    } else if(mode==='localstorage'){
      const data = lsLoad(); return (data[store]&&data[store][id])||null;
    } else { return memStore[store][id]||null; }
  }

  async function getAll(store){
    if(mode==='indexeddb'){
      return new Promise((resolve,reject)=>{
        try{
          const req = idbTx(store,'readonly').getAll();
          req.onsuccess = ()=>resolve(req.result||[]);
          req.onerror = ()=>reject(req.error);
        }catch(e){ reject(e); }
      });
    } else if(mode==='localstorage'){
      const data = lsLoad(); return Object.values(data[store]||{});
    } else { return Object.values(memStore[store]||{}); }
  }

  async function del(store, id){
    if(mode==='indexeddb'){
      return new Promise((resolve,reject)=>{
        try{
          const req = idbTx(store,'readwrite').delete(id);
          req.onsuccess = ()=>resolve(true);
          req.onerror = ()=>reject(req.error);
        }catch(e){ reject(e); }
      });
    } else if(mode==='localstorage'){
      const data = lsLoad(); if(data[store]) delete data[store][id];
      lsSave(data); return true;
    } else { delete memStore[store][id]; return true; }
  }

  async function clearStore(store){
    if(mode==='indexeddb'){
      return new Promise((resolve,reject)=>{
        try{
          const req = idbTx(store,'readwrite').clear();
          req.onsuccess = ()=>resolve(true);
          req.onerror = ()=>reject(req.error);
        }catch(e){ reject(e); }
      });
    } else if(mode==='localstorage'){
      const data = lsLoad(); data[store]={}; lsSave(data); return true;
    } else { memStore[store]={}; return true; }
  }

  async function clearAll(){ for(const s of STORES){ await clearStore(s); } }

  function getMode(){ return mode; }

  return { init, put, get, getAll, del, clearStore, clearAll, getMode };
})();

/* Safe wrapper: every DB op goes through this so failures surface honestly */
async function dbSave(store, record){
  try{
    const saved = await StorageManager.put(store, record);
    return { ok:true, data:saved };
  }catch(e){
    console.error('dbSave failed', store, e);
    return { ok:false, error: e && e.message ? e.message : 'Unknown storage error' };
  }
}
async function dbGetAll(store){
  try{ return await StorageManager.getAll(store); }
  catch(e){ console.error('dbGetAll failed', store, e); toast('Unable to load data from storage.','error'); return []; }
}
async function dbGet(store,id){
  try{ return await StorageManager.get(store,id); }
  catch(e){ console.error('dbGet failed', store, e); return null; }
}
async function dbDel(store,id){
  try{ await StorageManager.del(store,id); return true; }
  catch(e){ console.error('dbDel failed', store, e); toast('Unable to delete record.','error'); return false; }
}

async function addAudit(action, meta){
  await dbSave('auditLogs', { id: uid('audit'), action, meta: meta||{}, actor: Session.current ? Session.current.email : 'system', at: nowISO() });
}

  async create(userId, title, body, type){

  async listFor(userId){
    const all = await dbGetAll('notifications');
    return all.filter(n=>n.userId===userId).sort((a,b)=> new Date(b.at)-new Date(a.at));

  async unreadCount(userId){
    const list = await this.listFor(userId);
    return list.filter(n=>!n.read).length;

    for(const n of list){ if(!n.read){ n.read=true; await dbSave('notifications', n); } }

</script>

<script id="app-script-3">
/* =========================================================
   MATCHING / READINESS / SKILL-GAP LOGIC (real calculations)
   ========================================================= */
const CareerLogic = {
  ROLE_SKILLS: {
    'Data Analyst': ['Excel','SQL','Power BI','Python','Statistics'],
    'Business Analyst': ['Excel','SQL','Communication','Business Process','Power BI'],
    'Data Scientist': ['Python','Statistics','Machine Learning','SQL','Pandas'],
    'Python Developer': ['Python','OOP','Django','APIs','Git'],
    'Frontend Developer': ['HTML','CSS','JavaScript','React','Git'],
    'Backend Developer': ['Node.js','APIs','SQL','Databases','Git'],
    'Full Stack Developer': ['HTML','CSS','JavaScript','Node.js','SQL','React'],
    'Power BI Developer': ['Power BI','DAX','SQL','Excel','Data Modeling'],
    'SQL Developer': ['SQL','Database Design','Stored Procedures','Excel'],
    'MIS Executive': ['Excel','SQL','Reporting','VBA'],
    'AI/ML Intern': ['Python','Machine Learning','Statistics','Pandas','NumPy'],
    'QA Analyst': ['Testing','SQL','Bug Tracking','Automation Basics'],
    'HR Analyst': ['Excel','Communication','HRIS','Reporting'],
    'Digital Marketing Analyst': ['SEO','Analytics','Excel','Content Strategy'],
    'Financial Analyst': ['Excel','Financial Modeling','SQL','Statistics'],
    'Cloud Support Associate': ['Linux','Networking','Cloud Basics','Troubleshooting'],
    'Cybersecurity Intern': ['Networking','Security Basics','Linux','Risk Analysis'],
    'Database Analyst': ['SQL','Database Design','ETL','Excel'],
    'Web Developer': ['HTML','CSS','JavaScript','Git'],
    'UI/UX Intern': ['Figma','Wireframing','User Research','Prototyping'],
    'Research Analyst': ['Excel','Statistics','Report Writing','SQL'],
    'Operations Analyst': ['Excel','Process Improvement','Reporting','SQL']
  },
  ROADMAP_STAGES: [
    {key:'profile', label:'Profile Completion', desc:'Complete your personal, academic and career details.'},
    {key:'skills', label:'Core Skills', desc:'Add technical and soft skills to your profile.'},
    {key:'projects', label:'Project Builder', desc:'Add at least 1 project demonstrating your skills.'},
    {key:'resume', label:'Resume Ready', desc:'Build and complete your resume.'},
    {key:'applications', label:'Applications', desc:'Apply to at least 1 job matching your goal.'},
    {key:'interview', label:'Interview Ready', desc:'Attend or schedule at least 1 interview.'},
    {key:'placement', label:'Placement Ready', desc:'Reach Selected status on any application.'}
  ],

  profileCompletion(student){
    const fields = ['fullName','email','mobile','dob','gender','department','course','year','cgpa',
      'location','careerGoal','skills','linkedin','github'];
    let filled = 0;
    fields.forEach(f=>{
      const v = student[f];
      if(Array.isArray(v)? v.length>0 : (v!==undefined && v!==null && String(v).trim()!=='')) filled++;
    });
    let pct = Math.round((filled/fields.length)*100);
    if(student.projects && student.projects.length) pct = clamp(pct+5,0,100);
    if(student.certifications && student.certifications.length) pct = clamp(pct+5,0,100);
    return clamp(pct,0,100);
  },

  requiredSkillsFor(role){
    return this.ROLE_SKILLS[role] || ['Excel','Communication','Problem Solving'];
  },

  skillGap(student, role){
    const required = this.requiredSkillsFor(role || student.careerGoal || student.preferredRole);
    const have = (student.skills||[]).map(s=>s.trim().toLowerCase());
    const matched = required.filter(r=>have.includes(r.toLowerCase()));
    const missing = required.filter(r=>!have.includes(r.toLowerCase()));
    const pct = required.length ? Math.round((matched.length/required.length)*100) : 0;
    return { role: role||student.careerGoal||'General', required, matched, missing, pct };
  },

  jobMatchScore(student, job){
    const studentSkills = (student.skills||[]).map(s=>s.trim().toLowerCase());
    const reqSkills = (job.skills||[]).map(s=>s.trim().toLowerCase());
    let skillScore = 0;
    if(reqSkills.length){
      const matches = reqSkills.filter(s=>studentSkills.includes(s));
      skillScore = matches.length / reqSkills.length;
    }
    let goalScore = 0;
    const goal = (student.careerGoal||student.preferredRole||'').toLowerCase();
    if(goal && job.role && job.role.toLowerCase().includes(goal.split(' ')[0])) goalScore = 1;
    else if(goal && job.role && goal.includes(job.role.toLowerCase())) goalScore = 1;
    let locScore = 0;
    if(student.preferredLocation && job.location){
      locScore = student.preferredLocation.toLowerCase()===job.location.toLowerCase() ? 1 : (job.workMode==='Remote'?0.6:0);
    }
    let cgpaScore = 1;
    if(job.minCgpa && student.cgpa){ cgpaScore = Number(student.cgpa) >= Number(job.minCgpa) ? 1 : 0.3; }
    const weighted = (skillScore*0.55) + (goalScore*0.2) + (locScore*0.1) + (cgpaScore*0.15);
    return Math.round(weighted*100);
  },

  readinessScore(student, applications, resume){
    const profile = this.profileCompletion(student);
    const resumeScore = resume ? 100 : 0;
    const skillGapPct = this.skillGap(student).pct;
    const appActivity = clamp((applications.length)*15, 0, 100);
    const interviewActivity = clamp(applications.filter(a=>a.status==='Interview Scheduled'||a.status==='Selected').length*30,0,100);
    const total = Math.round(profile*0.3 + resumeScore*0.2 + skillGapPct*0.25 + appActivity*0.15 + interviewActivity*0.1);
    return clamp(total,0,100);
  },

  roadmapProgress(student, applications, resume, projects){
    const stages = this.ROADMAP_STAGES.map(s=>({...s, done:false}));
    stages[0].done = this.profileCompletion(student) >= 70;
    stages[1].done = (student.skills||[]).length >= 3;
    stages[2].done = (projects||student.projects||[]).length >= 1;
    stages[3].done = !!resume;
    stages[4].done = applications.length >= 1;
    stages[5].done = applications.some(a=>a.status==='Interview Scheduled'||a.status==='Selected');
    stages[6].done = applications.some(a=>a.status==='Selected');
    let currentIdx = stages.findIndex(s=>!s.done);
    if(currentIdx===-1) currentIdx = stages.length-1;
    stages.forEach((s,i)=>{ s.current = (i===currentIdx && !s.done); });
    return stages;
  },

  computeXP(student, applications, resume, projects){
    let xp = 0;
    xp += Math.round(this.profileCompletion(student)/10)*10;
    xp += (student.skills||[]).length*5;
    xp += (projects||student.projects||[]).length*10;
    if(resume) xp += 20;
    xp += applications.length*5;
    xp += applications.filter(a=>a.status==='Interview Scheduled').length*20;
    xp += applications.filter(a=>a.status==='Selected').length*40;
    return xp;
  }
};
</script>

<script id="app-script-5">
/* =========================================================

   ========================================================= */
/* =========================================================
   API CLIENT — talks to the real backend instead of IndexedDB.
   ========================================================= */
window.API_BASE = window.API_BASE || (location.origin.includes('file://') ? 'http://localhost:4000' : location.origin);
const AuthToken = {
  get(){ try{ return localStorage.getItem('ucas_api_token'); }catch(e){ return null; } },
  set(t){ try{ if(t) localStorage.setItem('ucas_api_token', t); else localStorage.removeItem('ucas_api_token'); }catch(e){} }
};
async function api(method, path, body){
  const headers = { 'Content-Type': 'application/json' };
  const token = AuthToken.get();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  let resp;
  try{
    resp = await fetch(window.API_BASE + path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  }catch(e){
    return { ok:false, status:0, data:{ error: 'Cannot reach the CareerSync AI server. Check your connection or that the backend is running.' } };
  }
  let data = null;
  try{ data = await resp.json(); }catch(e){ data = null; }
  return { ok: resp.ok, status: resp.status, data };
}

const Auth = {
  async registerStudent(form){
    const res = await api('POST', '/api/auth/register/student', {
      fullName: form.fullName, studentIdNo: form.studentIdNo, email: form.email, mobile: form.mobile,
      dob: form.dob, gender: form.gender, course: form.course, year: form.year, cgpa: form.cgpa,
      location: form.location, careerGoal: form.careerGoal, skills: form.skills, linkedin: form.linkedin,
      github: form.github, password: form.password, confirmPassword: form.confirmPassword
    });
    if(!res.ok){
      if(res.data && res.data.errors) return {ok:false, errors: res.data.errors};
      return {ok:false, errors:{_form: (res.data && res.data.error) || 'Unable to reach the server. Is the backend running?'}};
    }
    AuthToken.set(res.data.token);
    return {ok:true, student: res.data.student, userId: res.data.student.userId};
  },

  async registerRecruiter(form){
    const res = await api('POST', '/api/auth/register/recruiter', {
      companyName: form.companyName, recruiterName: form.recruiterName, email: form.email, phone: form.phone,
      designation: form.designation, website: form.website, industry: form.industry, description: form.description,
      location: form.location, password: form.password, confirmPassword: form.confirmPassword
    });
    if(!res.ok){
      if(res.data && res.data.errors) return {ok:false, errors: res.data.errors};
      return {ok:false, errors:{_form: (res.data && res.data.error) || 'Unable to reach the server. Is the backend running?'}};
    }
    return {ok:true, recruiter: res.data.recruiter};
  },

  async loginStudent(email, password){
    const res = await api('POST', '/api/auth/login', { email, password, role:'student' });
    if(!res.ok) return {ok:false, error: (res.data && res.data.error) || 'Login failed.'};
    AuthToken.set(res.data.token);
    return {ok:true, user:{id: res.data.student.userId, email}, student: res.data.student};
  },

  async loginRecruiter(email, password){
    const res = await api('POST', '/api/auth/login', { email, password, role:'recruiter' });
    if(!res.ok) return {ok:false, error: (res.data && res.data.error) || 'Login failed.', status: res.data && res.data.status};
    AuthToken.set(res.data.token);
    return {ok:true, user:{id: res.data.recruiter.userId, email}, recruiter: res.data.recruiter};
  },

  async loginAdmin(email, password){
    const res = await api('POST', '/api/auth/login', { email, password, role:'admin' });
    if(!res.ok) return {ok:false, error: (res.data && res.data.error) || 'Login failed.'};
    AuthToken.set(res.data.token);
    return {ok:true, admin: res.data.admin};
  }
};

<script id="app-script-7">
/* =========================================================
   ROUTER
   ========================================================= */
const Router = {
  routes: [],
  add(pattern, handler, guard){ this.routes.push({pattern, handler, guard}); },
  match(hash){
    for(const r of this.routes){
      const keys=[]; const rx = new RegExp('^'+r.pattern.replace(/:[^/]+/g,(m)=>{keys.push(m.slice(1)); return '([^/]+)';})+'$');
      const m = hash.match(rx);
      if(m){ const params={}; keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1])); return {route:r, params}; }
    }
    return null;
  },
  async go(){
    let hash = location.hash.slice(1) || '/';
    const found = this.match(hash);
    const appEl = $('#app');
    if(!found){ appEl.innerHTML = Layout.notFound(); return; }
    if(found.route.guard){
      const g = found.route.guard(found.params);
      if(g!==true){ location.hash = '#'+g; return; }
    }
    try{
      await found.route.handler(found.params);
    }catch(e){
      console.error('Route render error', e);
      appEl.innerHTML = `<div class="container" style="padding:60px 0;"><div class="card"><h2>Something went wrong</h2><p>${esc(e.message||'Unexpected error.')}</p><button class="btn btn-primary" onclick="location.hash='#/'">Go Home</button></div></div>`;
    }
    updateAiFabVisibility();
    window.scrollTo(0,0);
    appEl.classList.remove('route-fade'); void appEl.offsetWidth; appEl.classList.add('route-fade');
  },
  navigate(hash){ location.hash = hash; }
};
window.addEventListener('hashchange', ()=>Router.go());

function requireRole(role){
  return ()=>{
    if(!Session.current) return role==='admin' ? '/admin/login' : (role==='recruiter' ? '/recruiter/login' : '/student/login');
    if(Session.current.role!==role) return '/';
    return true;
  };
}
function guestOnly(){
  return ()=>{ if(Session.current){ return Session.current.role==='student'?'/student/dashboard': Session.current.role==='recruiter'?'/recruiter/dashboard':'/admin/dashboard'; } return true; };
}

function updateAiFabVisibility(){
  const fab = $('#ai-fab');
  if(Session.current && Session.current.role==='student'){ fab.classList.remove('hidden'); refreshAiFabIcon('idle'); }
  else{ fab.classList.add('hidden'); $('#ai-panel').classList.add('hidden'); }
}
</script>

        <div class="card kpi reveal"><b>${apps.length}</b><span>Applications</span></div>
        <div class="card kpi reveal"><b>${xp} XP</b><span>Career Progress</span></div>
      </div>
      <div class="grid grid-2">
        <div class="card reveal">
          <h4 style="margin-top:0;">Recommended Jobs for You</h4>
          ${scored.length? scored.map(s=>jobMiniCard(s.job,s.score)).join('') : `<div class="empty-state"><div class="e-icon">💼</div>Complete your skills to see recommendations.</div>`}

        </div>
        <div class="card reveal">

        </div>
        <div class="card reveal">
          <h4 style="margin-top:0;">Notifications ${unread?`<span class="badge badge-red">${unread} new</span>`:''}</h4>
          ${notifs.slice(0,4).map(n=>`<div class="notif-item ${!n.read?'unread':''}"><b>${esc(n.title)}</b>${esc(n.body)}<br><small>${fmtDateTime(n.at)}</small></div>`).join('') || `<div class="empty-state"><div class="e-icon">🔔</div>No notifications yet.</div>`}
          <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="location.hash='#/student/notifications'">View all →</button>

    <div><b style="font-size:13.5px;">${esc(job.role)}</b><br><small style="color:var(--text-mute);">${esc(job.company)} · ${esc(job.location)}</small></div>

  </div>`;
}
</script>

async function saveProfile(studentId){

  };

/* ---------- Camera capture (real getUserMedia, honest fallback) ---------- */
let __cameraStream = null;
async function startCamera(studentId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    openModal('Camera Unavailable', `<p>This browser does not support camera access. Please use "Upload Photo" instead.</p>`, `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
    return;
  }
  openModal('Take Profile Photo', `
    <div style="text-align:center;">
      <video id="cam-video" autoplay playsinline style="width:100%;max-width:360px;border-radius:10px;background:#000;"></video>
      <canvas id="cam-canvas" style="display:none;"></canvas>
      <img id="cam-captured" style="display:none;width:100%;max-width:360px;border-radius:10px;">
      <p id="cam-status" style="font-size:12.5px;color:var(--text-mute);margin-top:8px;">Requesting camera permission...</p>
    </div>`,
    `<button class="btn btn-ghost" onclick="stopCamera();closeModal()">Cancel</button>
     <button class="btn btn-outline" id="cam-capture-btn" onclick="captureCameraPhoto()">Capture</button>
     <button class="btn btn-outline hidden" id="cam-retake-btn" onclick="retakeCameraPhoto()">Retake</button>
     <button class="btn btn-primary hidden" id="cam-save-btn" onclick="saveCameraPhoto('${studentId}')">Save Photo</button>`);
  try{
    __cameraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
    $('#cam-video').srcObject = __cameraStream;
    $('#cam-status').textContent = 'Camera active — position your face and click Capture.';
  }catch(e){
    $('#cam-status').textContent = 'Camera permission denied or unavailable: '+(e.message||'unknown error')+'. Please use Upload Photo instead.';
    $('#cam-capture-btn').disabled = true;
  }
}
function stopCamera(){ if(__cameraStream){ __cameraStream.getTracks().forEach(t=>t.stop()); __cameraStream=null; } }
function captureCameraPhoto(){
  const video = $('#cam-video'); const canvas = $('#cam-canvas');
  canvas.width = video.videoWidth||360; canvas.height = video.videoHeight||360;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  $('#cam-captured').src = dataUrl; $('#cam-captured').style.display='block';
  video.style.display='none';
  $('#cam-capture-btn').classList.add('hidden'); $('#cam-retake-btn').classList.remove('hidden'); $('#cam-save-btn').classList.remove('hidden');
  window.__capturedPhoto = dataUrl;
  stopCamera();
}
function retakeCameraPhoto(){
  $('#cam-captured').style.display='none'; $('#cam-video').style.display='block';
  $('#cam-capture-btn').classList.remove('hidden'); $('#cam-retake-btn').classList.add('hidden'); $('#cam-save-btn').classList.add('hidden');
  startCamera(window.__lastPhotoStudentId);
}
async function saveCameraPhoto(studentId){
  window.__lastPhotoStudentId = studentId;
  const res = await api('POST', '/api/students/me/photo', { photoDataUrl: window.__capturedPhoto });
  closeModal();
  if(res.ok){ toast('Profile photo saved.','success'); renderStudentProfile(); } else toast('Unable to save photo: '+((res.data&&res.data.error)||'server error'),'error');
}
async function uploadPhoto(file, studentId){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please select an image file.','error'); return; }
  if(file.size > 3*1024*1024){ toast('Image too large (max 3MB).','error'); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const res = await api('POST', '/api/students/me/photo', { photoDataUrl: reader.result });
    if(res.ok){ toast('Profile photo updated.','success'); renderStudentProfile(); } else toast('Unable to save photo: '+((res.data&&res.data.error)||'server error'),'error');
  };
  reader.readAsDataURL(file);
}

/* ---------- Certificates (real CRUD, honest verification status) ---------- */
function certCard(c){
  return `<div class="card" style="padding:14px;">
    <b>${esc(c.name)}</b><br><small style="color:var(--text-mute);">${esc(c.issuer)}${c.issueDate?(' · '+fmtDate(c.issueDate)):''}</small>
    ${c.credentialId?`<div style="font-size:12px;margin-top:4px;">ID: ${esc(c.credentialId)}</div>`:''}
    ${c.url?`<div style="font-size:12px;"><a href="${esc(c.url)}" target="_blank" rel="noopener">View credential ↗</a></div>`:''}
    <span class="badge badge-grey" style="margin-top:6px;display:inline-block;">Not verified by admin</span>
    <div style="margin-top:8px;"><button class="btn btn-ghost btn-sm" onclick="openCertForm('${c.studentId}','${c.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteCert('${c.id}')">Delete</button></div>
  </div>`;
}
async function openCertForm(studentId, certId){
  let c = null;
  if(certId){
    const certsRes = await api('GET', '/api/certificates/mine');
    const found = certsRes.ok ? certsRes.data.certificates.find(x=>x.id===certId) : null;
    if(found) c = { name: found.name, issuer: found.issuer, issueDate: found.issue_date, credentialId: found.credential_id, url: found.url };
  }
  openModal(c?'Edit Certificate':'Add Certificate', `
    <div class="field"><label>Certificate Name</label><input id="c-name" value="${esc(c?.name||'')}"></div>
    <div class="field"><label>Issuing Organization</label><input id="c-issuer" value="${esc(c?.issuer||'')}"></div>
    <div class="grid grid-2">
      <div class="field"><label>Issue Date</label><input id="c-date" type="date" value="${c?.issueDate||''}"></div>
      <div class="field"><label>Credential ID (optional)</label><input id="c-credid" value="${esc(c?.credentialId||'')}"></div>
    </div>
    <div class="field"><label>Credential URL (optional)</label><input id="c-url" value="${esc(c?.url||'')}"></div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCert('${studentId}','${certId||''}')">Save</button>`);
}
async function saveCert(studentId, certId){
  const name = $('#c-name').value.trim();
  if(!name){ toast('Certificate name is required.','error'); return; }
  const payload = { name, issuer: $('#c-issuer').value.trim(), issueDate: $('#c-date').value, credentialId: $('#c-credid').value.trim(), url: $('#c-url').value.trim() };
  const res = certId ? await api('PUT', '/api/certificates/'+certId, payload) : await api('POST', '/api/certificates', payload);
  if(res.ok){ toast('Certificate saved.','success'); closeModal(); renderStudentProfile(); }
  else toast('Unable to save certificate: '+((res.data&&res.data.error)||'server error'),'error');
}
function deleteCert(certId){
  confirmAction('Delete this certificate?', async ()=>{
    const res = await api('DELETE', '/api/certificates/'+certId);
    if(res.ok){ toast('Certificate deleted.','success'); renderStudentProfile(); }
    else toast('Unable to delete certificate.','error');
  });
}
</script>

function renderJobList(){
  const {student, jobs, appliedIds} = window.__jobsCtx;
  let list = jobs.filter(j=>{
    const q = jobFilterState.q.toLowerCase();
    const matchQ = !q || j.role.toLowerCase().includes(q) || j.company.toLowerCase().includes(q);
    const matchLoc = !jobFilterState.location || j.location===jobFilterState.location;
    return matchQ && matchLoc;
  }).map(j=>({job:j, score: CareerLogic.jobMatchScore(student,j)}));
  if(jobFilterState.sort==='match') list.sort((a,b)=>b.score-a.score);
  else if(jobFilterState.sort==='deadline') list.sort((a,b)=>new Date(a.job.deadline)-new Date(b.job.deadline));
  else if(jobFilterState.sort==='salary') list.sort((a,b)=>b.job.salaryMax-a.job.salaryMax);

  $('#job-list-wrap').innerHTML = list.length ? list.map(({job,score})=>{
    const applied = appliedIds.has(job.id);
    const color = score>=70?'var(--success)': score>=40?'var(--warn)':'var(--danger)';
    return `<div class="card job-card reveal">
      <div class="jc-top">
        <div><b style="font-size:15px;">${esc(job.role)}</b><br><small style="color:var(--text-mute);">${esc(job.company)} · ${esc(job.location)} · ${esc(job.workMode)}</small></div>
        <div class="match-ring" style="background:${color};">${score}%</div>
      </div>
      <div class="tag-list">${job.skills.map(sk=>`<span class="skill-tag ${((student.skills||[]).map(x=>x.toLowerCase()).includes(sk.toLowerCase()))?'matched':''}">${esc(sk)}</span>`).join('')}</div>
      <div style="font-size:12.5px;color:var(--text-mute);">₹${(job.salaryMin/1000).toFixed(0)}K – ₹${(job.salaryMax/1000).toFixed(0)}K · ${esc(job.experience)} · Deadline ${fmtDate(job.deadline)}</div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="btn btn-outline btn-sm" onclick="viewJobDetail('${job.id}')">Details</button>

}

function jobDetailHtml(job, student){

/* ---------- Multi-step job application wizard: Details -> Application Form -> Review -> Submit ---------- */
async function openApplicationWizard(jobId){
  const student = await currentStudent();
  const existing = await studentApplications(student.id);
  if(existing.some(a=>a.jobId===jobId)){
    openModal('Already Applied', `<p>You have already applied for this position.</p>`, `<button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="closeModal();location.hash='#/student/applications'">View Application</button>`);
    return;
  }
  const jobRes = await api('GET', '/api/jobs/'+jobId);
  const job = jobRes.ok ? jobRes.data.job : null;
  if(!job){ toast('Unable to load this job.','error'); return; }
  const resume = await studentResume(student.id);
  window.__wizard = {
    step: 1, job, student, resume,
    form: {
      coverLetter:'', noticePeriod:'Immediate', expectedSalary:'', preferredLocation: student.preferredLocation||'',
      portfolio: student.portfolio||'', linkedin: student.linkedin||'', github: student.github||''
    }
  };
  renderWizardStep();
}
function renderWizardStep(){
  const w = window.__wizard;
  let body, foot;
  if(w.step===1){
    body = `<h4 style="margin-top:0;">Step 1 of 3 — Job Details</h4>${jobDetailHtml(w.job, w.student)}`;
    foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="wizardNext()">Continue to Application</button>`;
  } else if(w.step===2){
    body = `<h4 style="margin-top:0;">Step 2 of 3 — Application Details</h4>
      <div class="card" style="background:#f7f9fc;margin-bottom:12px;">
        <b>Your profile (from Profile page):</b>
        <p style="font-size:13px;margin:6px 0 0;">${esc(w.student.fullName)} · ${esc(w.student.email)} · ${esc(w.student.mobile)}<br>${esc(w.student.course)}, Year ${esc(w.student.year)}, CGPA ${esc(w.student.cgpa)}<br>Skills: ${(w.student.skills||[]).join(', ')||'None listed — add skills in Profile first for a stronger application.'}</p>
      </div>
      <div class="field"><label>Resume</label>
        ${w.resume ? `<div style="font-size:13px;">Using your saved resume (edit anytime in <a href="#/student/resume">Resume Builder</a>).</div>` : `<div style="font-size:13px;color:var(--danger);">No resume found. <button class="btn btn-outline btn-sm" onclick="closeModal();location.hash='#/student/resume'">Create Resume First</button></div>`}
      </div>
      <div class="field"><label>Cover Letter (optional)</label><textarea id="wz-cover" placeholder="Why are you interested in this role?">${esc(w.form.coverLetter)}</textarea></div>
      <div class="grid grid-2">
        <div class="field"><label>Notice Period / Availability</label><select id="wz-notice"><option ${w.form.noticePeriod==='Immediate'?'selected':''}>Immediate</option><option ${w.form.noticePeriod==='15 days'?'selected':''}>15 days</option><option ${w.form.noticePeriod==='1 month'?'selected':''}>1 month</option><option ${w.form.noticePeriod==='After exams'?'selected':''}>After exams</option></select></div>
        <div class="field"><label>Expected Salary (₹/month, optional)</label><input id="wz-salary" type="number" value="${esc(w.form.expectedSalary)}"></div>
      </div>
      <div class="field"><label>Preferred Location</label><input id="wz-location" value="${esc(w.form.preferredLocation)}"></div>
      <div class="grid grid-2">
        <div class="field"><label>LinkedIn</label><input id="wz-linkedin" value="${esc(w.form.linkedin)}"></div>
        <div class="field"><label>GitHub / Portfolio</label><input id="wz-github" value="${esc(w.form.github)}"></div>
      </div>`;
    foot = `<button class="btn btn-ghost" onclick="wizardBack()">Back</button><button class="btn btn-primary" onclick="wizardToReview()" ${w.resume?'':'disabled'}>Review Application</button>`;
  } else {
    const f = w.form;
    body = `<h4 style="margin-top:0;">Step 3 of 3 — Review Your Application</h4>
      <div class="card" style="background:#f7f9fc;">
        <p><b>${esc(w.job.role)}</b> at ${esc(w.job.company)}</p>
        <p style="font-size:13px;"><b>Applicant:</b> ${esc(w.student.fullName)} (${esc(w.student.email)})</p>
        <p style="font-size:13px;"><b>Cover Letter:</b> ${f.coverLetter? esc(f.coverLetter) : '<i>Not provided</i>'}</p>
        <p style="font-size:13px;"><b>Notice Period:</b> ${esc(f.noticePeriod)} · <b>Expected Salary:</b> ${f.expectedSalary?('₹'+esc(f.expectedSalary)):'Not specified'}</p>
        <p style="font-size:13px;"><b>Preferred Location:</b> ${esc(f.preferredLocation)||'Not specified'}</p>
        <p style="font-size:13px;"><b>Links:</b> ${[f.linkedin,f.github].filter(Boolean).map(esc).join(' · ')||'None'}</p>
        <p style="font-size:13px;"><b>Resume:</b> ${w.resume?'Attached (from Resume Builder)':'Missing'}</p>
      </div>
      <p style="font-size:12px;color:var(--text-mute);margin-top:10px;">Submitting will create a real application record visible to the recruiter and trackable from My Applications.</p>`;
    foot = `<button class="btn btn-ghost" onclick="wizardBack()">Back</button><button class="btn btn-primary" onclick="wizardSubmit()">Submit Application</button>`;
  }
  openModal('Apply — '+esc(window.__wizard.job.role), body, foot);
}
function wizardCaptureStep2(){
  const w = window.__wizard;
  w.form.coverLetter = $('#wz-cover') ? $('#wz-cover').value.trim() : w.form.coverLetter;
  w.form.noticePeriod = $('#wz-notice') ? $('#wz-notice').value : w.form.noticePeriod;
  w.form.expectedSalary = $('#wz-salary') ? $('#wz-salary').value : w.form.expectedSalary;
  w.form.preferredLocation = $('#wz-location') ? $('#wz-location').value.trim() : w.form.preferredLocation;
  w.form.linkedin = $('#wz-linkedin') ? $('#wz-linkedin').value.trim() : w.form.linkedin;
  w.form.github = $('#wz-github') ? $('#wz-github').value.trim() : w.form.github;
}
function wizardNext(){ window.__wizard.step = 2; renderWizardStep(); }
function wizardBack(){ if(window.__wizard.step===3){ wizardCaptureStep2(); } window.__wizard.step = Math.max(1, window.__wizard.step-1); renderWizardStep(); }
function wizardToReview(){ wizardCaptureStep2(); window.__wizard.step = 3; renderWizardStep(); }
async function wizardSubmit(){
  const w = window.__wizard;
  const res = await api('POST', '/api/applications', { jobId: w.job.id, applicationData: { ...w.form } });
  if(!res.ok){ toast((res.data && res.data.error) || 'Unable to submit application.','error'); if(res.status===409) closeModal(); return; }
  toast('Application submitted successfully.','success');
  closeModal();
  renderStudentJobs();
}
</script>

async function saveAiConfig(){

}
async function clearAiConfig(){
  const res = await dbSave('settings', { id:'aiConfig', provider:'', model:'', apiKey:'' });
  if(res.ok){ toast('AI provider cleared. Using local assistant mode.','info'); renderStudentSettings(); AI.refreshStatus(); }
}
async function toggleSound(enabled){ await dbSave('settings', {id:'soundConfig', enabled}); SoundFx.enabled = enabled; }
function confirmResetDemo(){
  confirmAction('This will erase ALL data (students, jobs, applications, chats, admins) and reseed fresh demo data. This cannot be undone. Continue?', async ()=>{
    await StorageManager.clearAll();

    setTimeout(()=>location.reload(), 900);
  });
}
</script>

<script id="app-script-20">

      </div>
      <div class="table-wrap"><table style="margin-top:10px;"><thead><tr><th>Role</th><th>Applicants</th><th>Status</th><th>Deadline</th><th></th></tr></thead><tbody>
        ${jobs.map(j=>{ const c = apps.filter(a=>a.jobId===j.id).length; return `<tr><td>${esc(j.role)}</td><td>${c}</td><td><span class="badge ${j.status==='open'?'badge-green':'badge-grey'}">${esc(j.status)}</span></td><td>${fmtDate(j.deadline)}</td>

      </tbody></table></div>
    </div>
  </div></div>`;
}
async function renderRecruiterJobs(){ renderRecruiterDashboard(); }

function openJobForm(jobId){
  (async ()=>{
    let job = null;
    if(jobId){ const r = await api('GET', '/api/jobs/'+jobId); job = r.ok ? r.data.job : null; }
    openModal(job?'Edit Job':'Post New Job', `
      <div class="field"><label>Role Title</label><input id="jf-role" value="${esc(job?.role||'')}"></div>
      <div class="grid grid-2">
        <div class="field"><label>Location</label><input id="jf-location" value="${esc(job?.location||'')}"></div>
        <div class="field"><label>Work Mode</label><select id="jf-mode"><option ${job?.workMode==='On-site'?'selected':''}>On-site</option><option ${job?.workMode==='Hybrid'?'selected':''}>Hybrid</option><option ${job?.workMode==='Remote'?'selected':''}>Remote</option></select></div>
      </div>
      <div class="field"><label>Required Skills (comma separated)</label><input id="jf-skills" value="${esc((job?.skills||[]).join(', '))}"></div>
      <div class="grid grid-2">
        <div class="field"><label>Salary Min</label><input id="jf-smin" type="number" value="${job?.salaryMin||20000}"></div>
        <div class="field"><label>Salary Max</label><input id="jf-smax" type="number" value="${job?.salaryMax||40000}"></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>Min CGPA</label><input id="jf-cgpa" type="number" step="0.1" value="${job?.minCgpa||0}"></div>
        <div class="field"><label>Deadline</label><input id="jf-deadline" type="date" value="${job?.deadline?job.deadline.slice(0,10):''}"></div>
      </div>
      <div class="field"><label>Vacancies</label><input id="jf-vac" type="number" value="${job?.vacancies||1}"></div>
      <div class="field"><label>Description</label><textarea id="jf-desc">${esc(job?.description||'')}</textarea></div>
      <div class="field"><label>Requirements</label><textarea id="jf-req">${esc(job?.requirements||'')}</textarea></div>
    `, `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>${job?`<button class="btn btn-danger" onclick="deleteJob('${job.id}')">Delete</button><button class="btn btn-outline" onclick="closeJob('${job.id}')">Close Job</button>`:''}<button class="btn btn-primary" onclick="saveJobForm('${job?job.id:''}')">Save</button>`);
  })();
}
async function saveJobForm(jobId){
  const data = {
    role: $('#jf-role').value.trim(), location: $('#jf-location').value.trim(), workMode: $('#jf-mode').value,
    skills: $('#jf-skills').value.split(',').map(s=>s.trim()).filter(Boolean),
    salaryMin: Number($('#jf-smin').value), salaryMax: Number($('#jf-smax').value), minCgpa: Number($('#jf-cgpa').value),
    deadline: $('#jf-deadline').value ? new Date($('#jf-deadline').value).toISOString() : new Date(Date.now()+30*86400000).toISOString(),
    vacancies: Number($('#jf-vac').value)||1, description: $('#jf-desc').value.trim(), requirements: $('#jf-req').value.trim()
  };
  if(!data.role){ toast('Role title is required.','error'); return; }
  const res = jobId ? await api('PUT', '/api/jobs/'+jobId, data) : await api('POST', '/api/jobs', data);
  if(res.ok){ toast('Job saved successfully.','success'); closeModal(); renderRecruiterDashboard(); }
  else toast('Unable to save job: '+((res.data&&res.data.error)||'server error'),'error');
}
async function deleteJob(jobId){
  closeModal();
  confirmAction('Delete this job posting permanently?', async ()=>{
    const res = await api('DELETE', '/api/jobs/'+jobId);
    if(res.ok){ toast('Job deleted.','success'); renderRecruiterDashboard(); }
    else toast('Unable to delete job.','error');
  });
}
async function closeJob(jobId){
  const res = await api('PATCH', '/api/jobs/'+jobId+'/status', { status:'closed' });
  closeModal();
  if(res.ok){ toast('Job closed.','info'); renderRecruiterDashboard(); }
  else toast('Unable to close job.','error');
}

async function viewApplicants(jobId){
  const jobRes = await api('GET', '/api/jobs/'+jobId);

  if(!jobRes.ok || !applicantsRes.ok){ toast('Unable to load applicants.','error'); return; }
  const job = jobRes.data.job;
  const rows = applicantsRes.data.applicants.map(x=>({a:x.application, s:x.student}));
  window.__lastApplicantRows = rows;
  $('#app').innerHTML = `${Layout.topbar('')}
  <div class="app-shell">${Layout.sidebarRecruiter('jobs')}
  <div class="main-area">
    <button class="btn btn-ghost btn-sm" onclick="renderRecruiterDashboard()">← Back to Jobs</button>

    <div class="card">
      ${rows.length? `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Student ID</th><th>CGPA</th><th>Match</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${rows.map(({a,s})=>`<tr>
        <td>${esc(s.fullName)}</td><td>${esc(s.studentIdNo)}</td><td>${esc(s.cgpa)}</td><td>${a.matchScore}%</td>
        <td><span class="badge badge-navy">${esc(a.status)}</span></td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="viewApplicantProfile('${s.id}','${a.id}')">View</button>
          <button class="btn btn-outline btn-sm" onclick="updateAppStatus('${a.id}','Shortlisted','${jobId}')">Shortlist</button>

          <button class="btn btn-primary btn-sm" onclick="updateAppStatus('${a.id}','Selected','${jobId}')">Select</button>
          <button class="btn btn-danger btn-sm" onclick="updateAppStatus('${a.id}','Rejected','${jobId}')">Reject</button>
        </td>
      </tr>`).join('')}</tbody></table></div>` : `<div class="empty-state"><div class="e-icon">📭</div>No applicants yet.</div>`}
    </div>
  </div></div>`;
}
async function viewApplicantProfile(studentId, appId){
  const rows = window.__lastApplicantRows || [];
  const found = rows.find(r=>r.s.id===studentId);
  const s = found ? found.s : null;
  if(!s){ toast('Unable to load candidate profile.','error'); return; }
  const a = found.a;
  const ad = a && a.applicationData || null;
  openModal(esc(s.fullName), `
    ${s.photo?`<img src="${s.photo}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:8px;">`:''}
    <p>${esc(s.email)} · ${esc(s.mobile)}</p>
    <p>${esc(s.course)} · Year ${esc(s.year)} · CGPA ${esc(s.cgpa)}</p>
    <div class="tag-list">${(s.skills||[]).map(sk=>`<span class="skill-tag">${esc(sk)}</span>`).join('')}</div>
    <p style="margin-top:10px;"><b>Projects:</b> ${(s.projects||[]).map(p=>esc(p.title)).join(', ')||'None'}</p>
    ${s.linkedin?`<p><a href="${esc(s.linkedin)}" target="_blank" rel="noopener">LinkedIn Profile</a></p>`:''}
    ${ad? `<div class="card" style="background:#f7f9fc;margin-top:10px;">
      <b>Application details</b>
      <p style="font-size:13px;margin:6px 0 0;">Cover letter: ${ad.coverLetter? esc(ad.coverLetter): '<i>Not provided</i>'}</p>
      <p style="font-size:13px;">Notice period: ${esc(ad.noticePeriod||'Not specified')} · Expected salary: ${ad.expectedSalary?('₹'+esc(ad.expectedSalary)):'Not specified'}</p>
    </div>` : ''}
  `, `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
}
async function updateAppStatus(appId, status, jobId){
  const res = await api('PATCH', '/api/applications/'+appId+'/status', { status });
  if(res.ok){ toast('Application status updated to '+status+'.','success'); viewApplicants(jobId); }
  else toast('Unable to update status: '+((res.data&&res.data.error)||'server error'),'error');
}
function openInterviewForm(appId, jobId){
  openModal('Schedule Interview', `
    <div class="field"><label>Date &amp; Time</label><input id="iv-date" type="datetime-local"></div>
    <div class="field"><label>Type</label><select id="iv-type"><option>Technical</option><option>HR</option><option>Behavioral</option><option>Managerial</option></select></div>
    <div class="field"><label>Mode</label><select id="iv-mode"><option>Online</option><option>In-person</option></select></div>

}
async function saveInterview(appId, jobId){
  const date = $('#iv-date').value;
  if(!date){ toast('Select a date and time.','error'); return; }
  const res = await api('POST', '/api/interviews', {
    applicationId: appId, date: new Date(date).toISOString(), type: $('#iv-type').value, mode: $('#iv-mode').value,
    link: $('#iv-link').value.trim(), notes: $('#iv-notes').value.trim()
  });
  if(res.ok){ toast('Interview scheduled.','success'); closeModal(); viewApplicants(jobId); }
  else toast('Unable to schedule interview: '+((res.data&&res.data.error)||'server error'),'error');

    <h2 class="serif" style="margin-top:0;">Candidate Search</h2>

<script id="app-script-21">
/* =========================================================
   ADMIN PORTAL
   ========================================================= */
async function renderAdminDashboard(){
  const statsRes = await api('GET', '/api/admin/stats');
  const recRes = await api('GET', '/api/admin/recruiters');
  const stuRes = await api('GET', '/api/admin/students');
  if(!statsRes.ok){ toast('Unable to load admin dashboard.','error'); return; }
  const stats = statsRes.data;
  const recruiters = recRes.ok ? recRes.data.recruiters : [];
  const students = stuRes.ok ? stuRes.data.students : [];
  const pendingRec = recruiters.filter(r=>r.status==='pending');
  const skillCount = {};
  students.forEach(s=>(s.skills||[]).forEach(sk=>skillCount[sk]=(skillCount[sk]||0)+1));
  const topSkills = Object.entries(skillCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('#app').innerHTML = `${Layout.topbar('')}
  <div class="app-shell">${Layout.sidebarAdmin('dashboard')}
  <div class="main-area">
    <h2 class="serif" style="margin-top:0;">Admin Dashboard</h2>
    <div class="grid grid-4">
      <div class="card kpi"><b>${stats.students}</b><span>Students</span></div>
      <div class="card kpi"><b>${stats.recruiters}</b><span>Approved Recruiters</span></div>
      <div class="card kpi"><b>${stats.jobs}</b><span>Jobs</span></div>
      <div class="card kpi"><b>${stats.selected}</b><span>Placements</span></div>
    </div>
    <div class="grid grid-2" style="margin-top:18px;">
      <div class="card">
        <h4 style="margin-top:0;">Pending Recruiter Approvals ${pendingRec.length?`<span class="badge badge-red">${pendingRec.length}</span>`:''}</h4>
        ${pendingRec.length? pendingRec.map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><div><b>${esc(r.companyName)}</b><br><small style="color:var(--text-mute);">${esc(r.recruiterName)} · ${esc(r.email)}</small></div><div><button class="btn btn-outline btn-sm" onclick="setRecruiterStatus('${r.id}','approved')">Approve</button> <button class="btn btn-danger btn-sm" onclick="setRecruiterStatus('${r.id}','rejected')">Reject</button></div></div>`).join('') : `<div class="empty-state"><div class="e-icon">✅</div>No pending approvals.</div>`}
      </div>
      <div class="card">
        <h4 style="margin-top:0;">Top Skills Across Students</h4>
        ${topSkills.map(([sk,c])=>`<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>${esc(sk)}</span><span>${c}</span></div><div class="progress-bar"><div style="width:${Math.round(c/students.length*100)}%"></div></div></div>`).join('') || 'Insufficient data for reliable analytics.'}
      </div>
    </div>
    <div class="grid grid-3" style="margin-top:18px;">
      <div class="card kpi"><b>${stats.applications}</b><span>Total Applications</span></div>
      <div class="card kpi"><b>${stats.pendingRecruiters}</b><span>Pending Approvals</span></div>
      <div class="card kpi"><b>${stats.selected}</b><span>Selected</span></div>
    </div>
  </div></div>`;
}
async function setRecruiterStatus(recId, status){
  const res = await api('PATCH', '/api/admin/recruiters/'+recId+'/status', { status });
  if(res.ok){
    toast('Recruiter '+status+'.','success');
    if(location.hash.includes('/admin/recruiters')) renderAdminRecruiters(); else renderAdminDashboard();
  } else toast('Unable to update recruiter: '+((res.data&&res.data.error)||'server error'),'error');
}

async function renderAdminStudents(){
  const stuRes = await api('GET', '/api/admin/students');
  const students = (stuRes.ok ? stuRes.data.students : []).sort((a,b)=>a.fullName.localeCompare(b.fullName));
  const roster = (await dbGetAll('rosterStudents')).sort((a,b)=>a.fullName.localeCompare(b.fullName));
  $('#app').innerHTML = `${Layout.topbar('')}
  <div class="app-shell">${Layout.sidebarAdmin('students')}
  <div class="main-area">
  <div class="pill-tabs"><button class="active" data-tab="registered" onclick="switchAdminStuTab('registered')">Registered Accounts (${students.length})</button><button data-tab="roster" onclick="switchAdminStuTab('roster')">Class Roster (${roster.length})</button></div>
  <div id="adm-stu-registered">
    <div style="display:flex;justify-content:space-between;align-items:center;"><h2 class="serif" style="margin:0;">Registered Students</h2><input id="adm-stu-q" placeholder="Search..." style="max-width:220px;padding:8px;border:1px solid var(--border);border-radius:8px;" oninput="filterAdminStudents()"></div>
    <div class="card"><div class="table-wrap"><table id="adm-stu-table"><thead><tr><th>Name</th><th>ID</th><th>Course</th><th>CGPA</th><th>Goal</th></tr></thead><tbody id="adm-stu-tbody"></tbody></table></div></div>
  </div>
  <div id="adm-stu-roster" class="hidden">
    <h2 class="serif">B.Sc CSDA Class Roster</h2>
    <p style="color:var(--text-mute);font-size:13px;">Official class list (browser-local — not yet migrated to the backend). Status updates once a matching name registers.</p>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Department</th><th>Status</th></tr></thead><tbody>
      ${roster.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.fullName)}</td><td>${esc(r.department)}</td><td>${r.linkedStudentId?'<span class="badge badge-green">Profile completed</span>':'<span class="badge badge-grey">Profile not completed</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>
  </div>
  </div></div>`;
  window.__adminStudents = students; filterAdminStudents();
}
function switchAdminStuTab(tab){
  $$('.pill-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  $('#adm-stu-registered').classList.toggle('hidden', tab!=='registered');
  $('#adm-stu-roster').classList.toggle('hidden', tab!=='roster');
}
function filterAdminStudents(){
  const q = ($('#adm-stu-q').value||'').toLowerCase();
  const list = window.__adminStudents.filter(s=>!q || s.fullName.toLowerCase().includes(q) || s.studentIdNo.toLowerCase().includes(q));
  $('#adm-stu-tbody').innerHTML = list.map(s=>`<tr><td>${esc(s.fullName)}</td><td>${esc(s.studentIdNo)}</td><td>${esc(s.course)}</td><td>${esc(s.cgpa)}</td><td>${esc(s.careerGoal||'')}</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center;">No students found.</td></tr>';
}

async function renderAdminRecruiters(){
  const res = await api('GET', '/api/admin/recruiters');
  const recs = (res.ok ? res.data.recruiters : []).sort((a,b)=>a.companyName.localeCompare(b.companyName));
  $('#app').innerHTML = `${Layout.topbar('')}
  <div class="app-shell">${Layout.sidebarAdmin('recruiters')}

function toCsv(rows, cols){
  const esc2 = v => `"${String(v===undefined||v===null?'':v).replace(/"/g,'""')}"`;
  const lines = [cols.join(',')];
  rows.forEach(r=> lines.push(cols.map(c=>esc2(typeof r[c]==='object'? JSON.stringify(r[c]) : r[c])).join(',')));
  return lines.join('\r\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime||'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function exportCsv(type){
  let rows, cols, filename;
  if(type==='students'){ const r=await api('GET','/api/admin/students'); rows=r.ok?r.data.students:[]; cols=['fullName','studentIdNo','email','mobile','course','year','cgpa','careerGoal','skills']; filename='students_export.csv'; }
  else if(type==='applications'){
    const r=await api('GET','/api/admin/applications'); rows=(r.ok?r.data.applications:[]).map(a=>({ student:a.studentName, job:a.jobRole, company:a.jobCompany, status:a.status, appliedAt:a.appliedAt }));
    cols=['student','job','company','status','appliedAt']; filename='applications_export.csv';
  } else if(type==='recruiters'){ const r=await api('GET','/api/admin/recruiters'); rows=r.ok?r.data.recruiters:[]; cols=['companyName','recruiterName','email','phone','status']; filename='recruiters_export.csv'; }
  else if(type==='jobs'){ const r=await api('GET','/api/admin/jobs'); rows=r.ok?r.data.jobs:[]; cols=['role','company','location','skills','status','deadline']; filename='jobs_export.csv'; }
  downloadFile(filename, toCsv(rows, cols));
  toast('Export downloaded: '+filename,'success');
}
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {headers:[], rows:[]};
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  const rows = lines.slice(1).map(line=>{
    const vals = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (vals[i]||'').replace(/^"|"$/g,'').replace(/""/g,'"'));
    return obj;
  });
  return {headers, rows};
}
// CSV import is intentionally not wired to the backend in this version —
// see the note on the Reports page. parseCsv() is kept as it's still used
// nowhere else destructively; no function writes unauthenticated local
